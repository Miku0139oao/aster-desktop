name: Verify macOS release installers and GUI
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Desktop checks and packages run whose selected Mac jobs have uploaded artifacts
        required: true
        type: string
      architecture:
        description: Mac architecture to verify
        required: true
        default: both
        type: choice
        options: [both, arm64, amd64]
      verify_gui:
        description: Launch the installed MyGo app after validating the installer
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-15","arch":"arm64","asset":"arm64"}]' || inputs.architecture == 'amd64' && '[{"runner":"macos-15-intel","arch":"x86_64","asset":"amd64"}]' || '[{"runner":"macos-15-intel","arch":"x86_64","asset":"amd64"},{"runner":"macos-15","arch":"arm64","asset":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Identify the package source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python3 - "$RUNNER_TEMP/build-run.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run['name'] == 'Desktop checks and packages'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['status'] in ('in_progress', 'completed')
          print('sha=' + run['head_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aster-desktop-${{ matrix.runner }}
          path: .build/mac-download
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and install the actual DMG and PKG
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          ASSET_ARCH: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cd .build/mac-download
          shasum -a 256 -c checksums.txt
          dmgs=(Aster-Desktop-*-macos-"$ASSET_ARCH".dmg)
          [[ ${#dmgs[@]} == 1 && -f "${dmgs[0]}" ]]
          dmg="${dmgs[0]}"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/aster-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          sudo installer -pkg "$mount/Install Aster Desktop.pkg" -target /
          app='/Applications/Aster Desktop.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist" "$app/Contents/Library/LaunchDaemons/app.astercore.desktop.helper.plist"
          for path in "$app/Contents/MacOS/Aster Desktop" "$app/Contents/Resources/aster-core" "$app/Contents/Resources/aster-bridge" "$app/Contents/Library/HelperTools/aster-helper"; do
            lipo "$path" -verify_arch "$EXPECTED_ARCH"
            [[ "$(stat -f '%u' "$path")" == 0 ]]
            file "$path"
          done
          privilege="$app/Contents/Frameworks/libAsterPrivilege.dylib"
          [[ -f "$privilege" && ! -L "$privilege" ]]
          lipo "$privilege" -verify_arch "$EXPECTED_ARCH"
          [[ "$(stat -f '%u' "$privilege")" == 0 ]]
          nm -gU "$privilege" > "$RUNNER_TEMP/aster-privilege-symbols.txt"
          grep -q ' _aster_privilege_request$' "$RUNNER_TEMP/aster-privilege-symbols.txt"
          grep -q ' _aster_privilege_free$' "$RUNNER_TEMP/aster-privilege-symbols.txt"
          python3 - "$app" <<'PY'
          import os, stat, sys
          app = sys.argv[1]
          for relative in ['', 'Contents', 'Contents/MacOS', 'Contents/Frameworks', 'Contents/Frameworks/libAsterPrivilege.dylib', 'Contents/Resources', 'Contents/Library', 'Contents/Library/HelperTools', 'Contents/Library/LaunchDaemons']:
              path = os.path.join(app, relative)
              info = os.lstat(path)
              assert info.st_uid == 0 and info.st_mode & 0o022 == 0 and not stat.S_ISLNK(info.st_mode), path
          PY
          "$app/Contents/Resources/aster-core" -v
          cp "$app/Contents/Resources/aster-core" "$app/Contents/Resources/aster-bridge" ../
      - name: Launch and activate the installed app
        if: inputs.verify_gui
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$VALIDATION_SHA"
          git show "$VALIDATION_SHA:scripts/test-native-launch.sh" > "$RUNNER_TEMP/test-native-launch.sh"
          bash "$RUNNER_TEMP/test-native-launch.sh" '/Applications/Aster Desktop.app/Contents/MacOS/Aster Desktop'
      - name: Record validation scope
        if: always()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERIFIED_GUI: ${{ inputs.verify_gui }}
        run: |
          printf 'Package source: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Validation harness: `%s`; application sources are the package source commit.\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'This disposable runner checks the DMG, PKG installation, signing and executable architecture. Native GUI driver requested: %s; skipped GUI is not a pass. Background-service authorization, real network system proxy/TUN and sleep/wake remain physical-Mac checks.\n' "$VERIFIED_GUI" >> "$GITHUB_STEP_SUMMARY"
