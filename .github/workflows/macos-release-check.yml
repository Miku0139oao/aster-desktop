name: Verify macOS release installers and GUI
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed Desktop checks and packages run containing the Mac artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            asset: amd64
          - runner: macos-15
            arch: arm64
            asset: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Identify the package source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python3 - "$RUNNER_TEMP/build-run.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run['name'] == 'Desktop checks and packages'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['status'] == 'completed'
          print('sha=' + run['head_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aster-desktop-${{ matrix.runner }}
          path: .build/mac-download
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and install the actual DMG and PKG
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          ASSET_ARCH: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cd .build/mac-download
          shasum -a 256 -c checksums.txt
          dmg="Aster-Desktop-0.1.3-macos-$ASSET_ARCH.dmg"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/aster-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          sudo installer -pkg "$mount/Install Aster Desktop.pkg" -target /
          app='/Applications/Aster Desktop.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist" "$app/Contents/Library/LaunchDaemons/app.astercore.desktop.helper.plist"
          for path in "$app/Contents/MacOS/Aster Desktop" "$app/Contents/Resources/aster-core" "$app/Contents/Resources/aster-bridge" "$app/Contents/Library/HelperTools/aster-helper"; do
            lipo -verify_arch "$EXPECTED_ARCH" "$path"
            [[ "$(stat -f '%u' "$path")" == 0 ]]
            file "$path"
          done
          python3 - "$app" <<'PY'
          import os, stat, sys
          app = sys.argv[1]
          for relative in ['', 'Contents', 'Contents/MacOS', 'Contents/Resources', 'Contents/Library', 'Contents/Library/HelperTools', 'Contents/Library/LaunchDaemons']:
              path = os.path.join(app, relative)
              info = os.lstat(path)
              assert info.st_uid == 0 and info.st_mode & 0o022 == 0 and not stat.S_ISLNK(info.st_mode), path
          PY
          "$app/Contents/Resources/aster-core" -v
          cp "$app/Contents/Resources/aster-core" "$app/Contents/Resources/aster-bridge" ../
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Native macOS GUI with the installed package binaries
        run: flutter test integration_test -d macos
      - name: Record validation scope
        if: always()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'Package source: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'This disposable runner checks the DMG, PKG installation, signing, executable architecture and native GUI import/routing/YAML/proxy lifecycle. Background-service authorization, real network system proxy/TUN and sleep/wake remain physical-Mac checks.\n' >> "$GITHUB_STEP_SUMMARY"
