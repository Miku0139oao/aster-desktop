name: Capture native visual baselines for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # This workflow captures images, it does not approve them or replace tests.
      # Inspect the artifact and commit reviewed images before normal CI runs.
      - run: ASTER_TEST_ARTIFACTS="$GITHUB_WORKSPACE/.build/visual-evidence" go test ./internal/desktopui -run TestNativeOverviewAndJump -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: native-goldens-${{ matrix.os }}
          path: .build/visual-evidence/
          include-hidden-files: true
