name: Capture native visual baselines for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # This workflow captures images, it does not approve them or replace tests.
      # Inspect the artifact and commit reviewed images before normal CI runs.
      - run: flutter test --update-goldens --plain-name 'light and dark Material 3 overview renders'
      - uses: actions/upload-artifact@v4
        with:
          name: native-goldens-${{ matrix.os }}
          path: evidence/
