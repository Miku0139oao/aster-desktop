name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform to build and verify
        default: all
        type: choice
        options: [all, windows-2022, ubuntu-24.04, macos-15-intel, macos-15]
      verify_gui:
        description: Run native macOS GUI validation after packaging
        default: true
        type: boolean
      refresh_visual_baselines:
        description: Regenerate platform baselines after an intentional visual change (review uploaded renders)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner != '' && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["windows-2022","ubuntu-24.04","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev dpkg-dev zstd xvfb
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Cross-process single instance lifecycle
        run: dart run scripts/test_single_instance.dart
      - name: Widget and visual tests
        run: flutter test ${{ inputs.refresh_visual_baselines && '--update-goldens' || '' }}
      - name: Preserve rendered platform baselines
        if: inputs.refresh_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.os }}
          path: evidence/**/*.png
      - name: Preserve failed visual comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures-${{ matrix.os }}
          path: test/failures/*.png
          if-no-files-found: ignore
      - name: Go tests
        working-directory: bridge
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Build Unix packages
        if: runner.os != 'Windows'
        run: bash scripts/build.sh
      - name: Preserve built packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-desktop-${{ matrix.os }}
          path: dist/*
      - name: Windows installer extraction and rollback (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installer.ps1 -PayloadPath "$pwd/bridge/.build/setup/payload.zip"
      - name: Real core lifecycle and rollback tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          cd bridge
          go test ./... -count=1
      - name: Real core lifecycle and rollback tests (Unix)
        if: runner.os != 'Windows'
        run: cd bridge && ASTER_TEST_CORE="$GITHUB_WORKSPACE/.build/aster-core" go test ./... -count=1
      - name: Windows LocalSystem service and TUN regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          $env:ASTER_TEST_WINDOWS_SERVICE='disposable-runner'
          cd bridge
          go test ./internal/desktop -run TestWindowsServiceTUNLifecycle -count=1 -v -timeout 3m
      - name: Native GUI workflow (Windows)
        if: runner.os == 'Windows'
        run: flutter test integration_test -d windows
      - name: Native GUI workflow (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test -d linux
      - name: Native GUI workflow (macOS)
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.verify_gui)
        timeout-minutes: 15
        run: flutter drive --driver=test_driver/desktop_test.dart --target=integration_test/desktop_test.dart -d macos
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the Android NDK used by gomobile
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" --output "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sudo mkdir -p "$SDK_ROOT/ndk"
          sudo rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          sudo mv "$RUNNER_TEMP/android-ndk-r28c" "$SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aster-release.jks"
          test -s "$RUNNER_TEMP/aster-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/aster-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
      - name: Build Android engine and APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aster-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/build-android.py
      - name: Verify packaged native engines
        run: |
          set -euo pipefail
          cd build/android
          sha256sum -c checksums.txt
          unzip -t app/mobileapi.aar > /dev/null
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs Aster-Desktop-*-android.apk | tee apk-signing.txt
      - name: Preserve Android packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-android
          path: |
            build/android/Aster-Desktop-*-android.apk
            build/android/checksums.txt
            build/android/apk-signing.txt
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install Xcode project helper
        run: gem install xcodeproj --no-document
      - name: Build Go XCFramework and unsigned iOS app
        run: python3 scripts/build-ios.py
      - name: Verify iOS app, tunnel, framework, and App Intents
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          fail() { echo "iOS verification failed: $1" >&2; exit 1; }
          test -x "$app/Runner" || fail "Runner executable is missing"
          test -d "$app/Frameworks/Mobileapi.framework" || fail "app does not embed Mobileapi.framework"
          test -x "$app/PlugIns/AsterTunnel.appex/AsterTunnel" || fail "AsterTunnel extension executable is missing"
          test -d "$app/PlugIns/AsterTunnel.appex/Frameworks/Mobileapi.framework" || fail "extension does not embed Mobileapi.framework"
          test -d "$app/Metadata.appintents" || fail "App Intents metadata is missing"
          # An unsigned CI build cannot carry entitlements, so check the
          # configuration that a signed build would embed.
          plutil -extract NSExtension.NSExtensionPointIdentifier raw \
            "$app/PlugIns/AsterTunnel.appex/Info.plist" \
            | grep -qx com.apple.networkextension.packet-tunnel || fail "extension point is not packet-tunnel"
          plutil -extract CFBundleIdentifier raw "$app/PlugIns/AsterTunnel.appex/Info.plist" \
            | grep -qx app.aster.desktop.tunnel || fail "extension bundle id is not app.aster.desktop.tunnel"
          grep -q group.app.aster.desktop ios/Runner/Runner.entitlements || fail "app App Group entitlement is missing"
          grep -q group.app.aster.desktop ios/AsterTunnel/AsterTunnel.entitlements || fail "extension App Group entitlement is missing"
          grep -q packet-tunnel-provider ios/AsterTunnel/AsterTunnel.entitlements || fail "extension packet-tunnel entitlement is missing"
          # gomobile produces a static framework, so the engine is linked into
          # both binaries rather than recorded in otool -L as a dylib. Check the
          # exported symbol, falling back to the string table if the release
          # binary has been stripped.
          has_engine() {
            nm -gU "$1" 2>/dev/null | grep -q "MobileapiOpenHost" \
              || strings -a "$1" | grep -q "MobileapiOpenHost"
          }
          has_engine "$app/Runner" || fail "app does not link the mobile engine"
          has_engine "$app/PlugIns/AsterTunnel.appex/AsterTunnel" \
            || fail "extension does not link the mobile engine"
      - name: Package the unsigned app for CI inspection
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/Aster-iOS-unsigned.zip
          shasum -a 256 ios/mobileapi.xcframework.sha256 build/Aster-iOS-unsigned.zip > build/ios-checksums.txt
      - name: Preserve iOS build
        uses: actions/upload-artifact@v4
        with:
          name: aster-ios-unsigned
          path: |
            build/Aster-iOS-unsigned.zip
            build/ios-checksums.txt
