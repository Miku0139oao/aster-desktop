name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform to build and verify
        default: all
        type: choice
        options: [all, windows-2022, ubuntu-24.04, macos-15-intel, macos-15]
      verify_gui:
        description: Run native macOS GUI validation after packaging
        default: true
        type: boolean
      refresh_visual_baselines:
        description: Regenerate platform baselines after an intentional visual change (review uploaded renders)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner != '' && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["windows-2022","ubuntu-24.04","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev dpkg-dev zstd xvfb
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Cross-process single instance lifecycle
        run: dart run scripts/test_single_instance.dart
      - name: Widget and visual tests
        run: flutter test ${{ inputs.refresh_visual_baselines && '--update-goldens' || '' }}
      - name: Preserve rendered platform baselines
        if: inputs.refresh_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.os }}
          path: evidence/**/*.png
      - name: Preserve failed visual comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures-${{ matrix.os }}
          path: test/failures/*.png
          if-no-files-found: ignore
      - name: Go tests
        working-directory: bridge
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Build Unix packages
        if: runner.os != 'Windows'
        run: bash scripts/build.sh
      - name: Preserve built packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-desktop-${{ matrix.os }}
          path: dist/*
      - name: Windows installer extraction and rollback (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installer.ps1 -PayloadPath "$pwd/bridge/.build/setup/payload.zip"
      - name: Real core lifecycle and rollback tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          cd bridge
          go test ./... -count=1
      - name: Real core lifecycle and rollback tests (Unix)
        if: runner.os != 'Windows'
        run: cd bridge && ASTER_TEST_CORE="$GITHUB_WORKSPACE/.build/aster-core" go test ./... -count=1
      - name: Windows LocalSystem service and TUN regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          $env:ASTER_TEST_WINDOWS_SERVICE='disposable-runner'
          cd bridge
          go test ./internal/desktop -run TestWindowsServiceTUNLifecycle -count=1 -v -timeout 3m
      - name: Native GUI workflow (Windows)
        if: runner.os == 'Windows'
        run: flutter test integration_test -d windows
      - name: Native GUI workflow (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test -d linux
      - name: Native GUI workflow (macOS)
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.verify_gui)
        timeout-minutes: 15
        run: flutter drive --driver=test_driver/desktop_test.dart --target=integration_test/desktop_test.dart -d macos
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the Android NDK used by gomobile
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" --output "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sudo mkdir -p "$SDK_ROOT/ndk"
          sudo rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          sudo mv "$RUNNER_TEMP/android-ndk-r28c" "$SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Decode the release signing key
        id: release_key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aster-release.jks"
            {
              echo "ASTER_ANDROID_KEYSTORE=$RUNNER_TEMP/aster-release.jks"
              echo "ASTER_ANDROID_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ASTER_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ASTER_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are not configured; the APK will use the debug key."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android engine and APKs
        run: python3 scripts/build-android.py
      - name: Verify packaged native engines
        run: |
          set -euo pipefail
          cd build/android
          sha256sum -c checksums.txt
          unzip -t app/mobileapi.aar > /dev/null
      - name: Verify the release signature
        if: steps.release_key.outputs.present == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Preserve Android packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/android/checksums.txt
