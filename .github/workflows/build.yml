name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform to build and verify
        default: all
        type: choice
        options: [all, windows-2022, ubuntu-24.04, macos-15-intel, macos-15]
      verify_gui:
        description: Launch the packaged macOS app after building
        default: true
        type: boolean
      refresh_visual_baselines:
        description: Capture MyGo overview screenshots for review
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner != '' && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["windows-2022","ubuntu-24.04","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bridge/go.sum
      - name: Warm the Go module cache
        shell: bash
        working-directory: bridge
        env:
          GOTOOLCHAIN: go1.26.3
        run: |
          # proxy.golang.org intermittently times out mid-download; a failure
          # here would otherwise surface as a broken test run.
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libayatana-appindicator3-1 libgl1 dpkg-dev zstd xvfb
      - name: Release tooling tests
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile scripts/assemble-release.py scripts/package-docs.py
          python3 scripts/test-assemble-release.py
      - name: MyGo UI and activation tests
        env:
          ASTER_TEST_ARTIFACTS: ${{ inputs.refresh_visual_baselines && format('{0}/.build/native-screenshots', github.workspace) || '' }}
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Preserve rendered MyGo overview
        if: inputs.refresh_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.os }}
          path: .build/native-screenshots/*.png
          include-hidden-files: true
      - name: Go tests
        working-directory: bridge
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: go1.26.3
        run: go test ./...
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Build Unix packages
        if: runner.os != 'Windows'
        run: bash scripts/build.sh
      - name: Preserve built packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-desktop-${{ matrix.os }}
          path: dist/*
      - name: Windows installer extraction and rollback (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installer.ps1 -PayloadPath "$pwd/bridge/.build/setup/payload.zip"
      - name: Real core lifecycle and rollback tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN='go1.26.3'
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          cd bridge
          go test ./... -count=1
      - name: Real core lifecycle and rollback tests (Unix)
        if: runner.os != 'Windows'
        run: cd bridge && GOTOOLCHAIN=go1.26.3 ASTER_TEST_CORE="$GITHUB_WORKSPACE/.build/aster-core" go test ./... -count=1
      - name: Install, launch, and remove the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath dist -Filter 'Aster-Desktop-*-windows-x64-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected one Windows installer' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installed-launch.ps1 -SetupPath $setup[0].FullName
      - name: Windows LocalSystem service and TUN regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN='go1.26.3'
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          $env:ASTER_TEST_WINDOWS_SERVICE='disposable-runner'
          cd bridge
          go test ./internal/desktop -run TestWindowsServiceTUNLifecycle -count=1 -v -timeout 8m
      - name: MyGo workflow with the packaged engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASTER_TEST_CORE="$pwd/.build/aster-core.exe"
          $env:ASTER_TEST_BRIDGE="$pwd/.build/aster-bridge.exe"
          go test ./internal/desktopui -run TestNativeBridgeWorkflow -count=1 -v
      - name: MyGo workflow with the packaged engine (Unix)
        if: runner.os != 'Windows'
        run: ASTER_TEST_BRIDGE="$GITHUB_WORKSPACE/.build/aster-bridge" ASTER_TEST_CORE="$GITHUB_WORKSPACE/.build/aster-core" go test ./internal/desktopui -run TestNativeBridgeWorkflow -count=1 -v
      - name: Launch the MyGo Linux bundle
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/test-native-launch.sh .build/native/linux-bundle/aster_desktop
      - name: Launch the MyGo macOS bundle
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.verify_gui)
        run: bash scripts/test-native-launch.sh '.build/native/Aster Desktop.app/Contents/MacOS/Aster Desktop'
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - name: Warm the Go module cache
        shell: bash
        working-directory: bridge
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the Android NDK used by gomobile
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" --output "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sudo mkdir -p "$SDK_ROOT/ndk"
          sudo rm -rf "$SDK_ROOT/ndk/28.2.13676358"
          sudo mv "$RUNNER_TEMP/android-ndk-r28c" "$SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Flutter mobile UI checks
        run: |
          flutter analyze
          flutter test
      - name: Prepare Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aster-release.jks"
          test -s "$RUNNER_TEMP/aster-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/aster-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
      - name: Build Android engine and APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aster-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/build-android.py
      - name: Verify packaged native engines
        run: |
          set -euo pipefail
          cd build/android
          sha256sum -c checksums.txt
          unzip -t app/mobileapi.aar > /dev/null
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs Aster-Desktop-*-android.apk | tee apk-signing.txt
      - name: Preserve Android packages
        uses: actions/upload-artifact@v4
        with:
          name: aster-android
          path: |
            build/android/Aster-Desktop-*-android.apk
            build/android/checksums.txt
            build/android/apk-signing.txt
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: bridge/go.sum
      - name: Warm the Go module cache
        shell: bash
        working-directory: bridge
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install Xcode project helper
        run: gem install xcodeproj --no-document
      - name: Build Go XCFramework and unsigned iOS app
        run: python3 scripts/build-ios.py
      - name: Verify iOS app, tunnel, framework, and App Intents
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          fail() { echo "iOS verification failed: $1" >&2; exit 1; }
          test -x "$app/Runner" || fail "Runner executable is missing"
          test -x "$app/PlugIns/AsterTunnel.appex/AsterTunnel" || fail "AsterTunnel extension executable is missing"
          test -d "$app/Metadata.appintents" || fail "App Intents metadata is missing"
          # An unsigned CI build cannot carry entitlements, so check the
          # configuration that a signed build would embed.
          plutil -extract NSExtension.NSExtensionPointIdentifier raw \
            "$app/PlugIns/AsterTunnel.appex/Info.plist" \
            | grep -qx com.apple.networkextension.packet-tunnel || fail "extension point is not packet-tunnel"
          plutil -extract CFBundleIdentifier raw "$app/Info.plist" \
            | grep -qx app.aster.desktop || fail "app bundle id is not app.aster.desktop"
          plutil -extract CFBundleIdentifier raw "$app/PlugIns/AsterTunnel.appex/Info.plist" \
            | grep -qx app.aster.desktop.tunnel || fail "extension bundle id is not app.aster.desktop.tunnel"
          grep -q group.app.aster.desktop ios/Runner/Runner.entitlements || fail "app App Group entitlement is missing"
          grep -q group.app.aster.desktop ios/AsterTunnel/AsterTunnel.entitlements || fail "extension App Group entitlement is missing"
          grep -q packet-tunnel-provider ios/AsterTunnel/AsterTunnel.entitlements || fail "extension packet-tunnel entitlement is missing"
          # gomobile produces a static framework, so the engine is linked into
          # both binaries rather than recorded in otool -L as a dylib. Check the
          # exported symbol, falling back to the string table if the release
          # binary has been stripped.
          has_engine() {
            nm -gU "$1" 2>/dev/null | grep -q "MobileapiOpenHost" \
              || strings -a "$1" | grep -q "MobileapiOpenHost"
          }
          has_engine "$app/Runner" || fail "app does not link the mobile engine"
          has_engine "$app/PlugIns/AsterTunnel.appex/AsterTunnel" \
            || fail "extension does not link the mobile engine"
      - name: Package the unsigned app for CI inspection
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/Aster-iOS-unsigned.zip
          # The framework is linked statically, so the zip does not contain it.
          # Record the engine digest next to the app checksum for traceability.
          {
            echo "engine sha256 $(cat ios/mobileapi.xcframework.sha256)"
            shasum -a 256 build/Aster-iOS-unsigned.zip
          } > build/ios-checksums.txt
      - name: Preserve iOS build
        uses: actions/upload-artifact@v4
        with:
          name: aster-ios-unsigned
          path: |
            build/Aster-iOS-unsigned.zip
            build/ios-checksums.txt
  release:
    # A tag is the public act: every platform must have built from the same
    # commit before the release is published. Publishes nothing on branches.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read and confirm the tagged version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import pathlib, re
          match = re.search(
              r'(?m)^version:\s*([^+\s]+)\+\d+\s*$',
              pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'),
          )
          if not match:
              raise SystemExit('pubspec.yaml has no version')
          print(match.group(1))
          PY
          )
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Build the offline manual
        run: |
          set -euo pipefail
          # Ubuntu 24.04 python is externally managed; the system pip would
          # refuse to install. A throwaway venv keeps the runner unchanged.
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --disable-pip-version-check -r scripts/docs-requirements.txt
          "$RUNNER_TEMP/docs-venv/bin/python" scripts/package-docs.py \
            --version "${{ steps.version.outputs.version }}" \
            --output release
      - name: Assemble assets, checksums and notes
        run: |
          python3 scripts/assemble-release.py \
            --version "${{ steps.version.outputs.version }}" \
            --artifacts release-assets \
            --output release \
            --meta release-meta
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$(cat release-meta/release-title.txt)" \
            --notes-file release-meta/release-notes.md \
            --verify-tag \
            release/*
      - name: Record the published release
        if: always()
        run: |
          {
            echo "### Aster Desktop ${{ steps.version.outputs.version }}"
            echo
            echo "Tag: \`$GITHUB_REF_NAME\`"
            echo
            echo "Assets:"
            for file in release/*; do
              echo "- \`$(basename "$file")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
